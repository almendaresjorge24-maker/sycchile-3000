name: sycchile3000

services:
  sycchile-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sycchile_3000_core
    restart: unless-stopped
    ports:
      # Solo visible desde este computador. Para abrirlo a la red, cambia a "8080:8080"
      - "127.0.0.1:8080:8080"
    environment:
      - SYSTEM_NAME=SYCCHILE 3.000
      - GOVERNANCE_LEAD=JORGE ALMENDARES AROS
      - ENGINE_KALLPA=FIFO_STRICT
      - AUDITOR_AURA=EQUITY_AND_TRACEABILITY
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - sycchile_network

  # Agentes KALLPA y AURA: servicio interno, sin puerto publicado (solo Nginx puede hablarle)
  agentes:
    build: ./agentes
    container_name: sycchile_agentes
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
    networks:
      - sycchile_network

networks:
  sycchile_network:
    name: sycchile_net
    driver: bridge
