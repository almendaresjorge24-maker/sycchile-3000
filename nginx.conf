# Limita peticiones por visitante (frena abusos y ataques de saturación)
limit_req_zone $binary_remote_addr zone=sycchile_limite:10m rate=10r/s;

server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    limit_req zone=sycchile_limite burst=20 nodelay;

    # --- Cabeceras de seguridad ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';" always;

    # Bloquea archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Agentes KALLPA y AURA: único camino hacia el servicio interno (solo POST de datos y GET de salud)
    location /api/agentes/ {
        limit_except GET POST { deny all; }
        client_max_body_size 8k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $agentes http://agentes:3000;
        proxy_pass $agentes;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
